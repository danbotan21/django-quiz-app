name: Auto 987 export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Export 987 questions
        run: python tools/auto_987_export.py
      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: auto-987-export
          path: export-output
          if-no-files-found: error
          retention-days: 1
